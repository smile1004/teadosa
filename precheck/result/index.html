<!DOCTYPE html>
<html lang="ko">
<head>
  <base href="../../">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사전검토 결과 확인 - 태양광도사</title>
  <link href="common/css/service-steps.css" rel="stylesheet">
  <link href="common/css/shared-layout.css" rel="stylesheet">
  <link href="common/css/shared-menu.css" rel="stylesheet">
  <link href="common/css/common.css" rel="stylesheet">
  <link href="precheck/result/css/style.css?v=2.7" rel="stylesheet">
</head>
<body>
  <script src="common/js/site-config.js"></script>
  <script src="common/js/api.js?v=2.4"></script>
  <script src="common/js/auth.js?v=2.4"></script>
  <script src="common/js/components/header.js?v=2.6"></script>

  <main class="step-unified-shell">
    <section class="service-step-hero">
      <div class="service-step-label">STEP 02</div>
      <h1>사전검토 결과 확인</h1>
      <p>관리자가 검토 완료 후 공개한 결과보고서를 확인할 수 있습니다.</p>
    </section>

    <div class="step-unified-content">
      <main class="wrap">
        <p id="result-message" class="result-system-message" role="status">검토결과를 확인하고 있습니다.</p>

        <div id="result-content" hidden>
          <section class="summary">
            <div class="summary-card"><span>종합 판정</span><strong id="summary-possibility">-</strong></div>
            <div class="summary-card"><span>신청번호</span><strong id="summary-request-no">-</strong></div>
            <div class="summary-card"><span>검토 공개일</span><strong id="summary-published-at">-</strong></div>
          </section>

          <section class="card">
            <h2>신청 기본정보</h2>
            <div id="result-basic-info" class="info-grid"></div>
          </section>

          <section class="card result-map-card" aria-labelledby="result-map-title">
            <div class="result-map-head">
              <div>
                <h2 id="result-map-title">태양광 설치 가능 위치</h2>
                <p id="result-map-address" class="result-map-address">신청 주소의 위치를 확인하고 있습니다.</p>
              </div>
              <div class="result-map-controls" aria-label="지도 유형 선택">
                <button class="result-map-type is-active" type="button" data-map-type="roadmap" aria-pressed="true">일반지도</button>
                <button class="result-map-type" type="button" data-map-type="skyview" aria-pressed="false">위성지도</button>
                <button id="result-map-cadastral" class="result-map-type" type="button" aria-pressed="false">지적도</button>
              </div>
            </div>
            <div class="result-map-frame">
              <div id="result-map" role="img" aria-label="신청 주소 지도"></div>
              <p id="result-map-message" class="result-map-message" role="status">지도를 불러오고 있습니다.</p>
            </div>
            <p class="result-map-caption">지도상의 위치와 경계는 참고용이며 실제 현황 및 인허가 검토 결과와 다를 수 있습니다.</p>
          </section>

          <section class="card">
            <div class="result-section-head"><h2>검토 결과</h2></div>
            <div id="result-items" class="result-items"></div>
          </section>

          <section class="card">
            <h2>종합 의견</h2>
            <div id="overall-opinion-view" class="note result-preline"></div>
          </section>

          <section id="customer-notice-card" class="card notice-card" hidden>
            <h2>안내사항</h2>
            <div id="customer-notice-view" class="important-notice-list result-preline"></div>
          </section>

          <div class="btns">
            <button class="btn primary" type="button" onclick="window.print()">검토 결과 인쇄</button>
            <button id="available-service-button" class="btn service" type="button">가능서비스 확인</button>
          </div>
        </div>
      </main>
    </div>
  </main>

  <script src="common/js/components/footer.js"></script>
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=06b61338ce778daa454c9a8d78e41e06&libraries=services&autoload=false"></script>
  <script src="precheck/result/js/script.js?v=2.6"></script>
</body>
</html>
