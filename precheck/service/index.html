<!DOCTYPE html>
<html lang="ko">
<head>
  <base href="../../">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>가능서비스 확인 - 태양광도사</title>
  <link href="common/css/service-steps.css" rel="stylesheet">
  <link href="common/css/shared-layout.css" rel="stylesheet">
  <link href="common/css/shared-menu.css" rel="stylesheet">
  <link href="common/css/common.css" rel="stylesheet">
  <link href="precheck/service/css/style.css?v=2.4" rel="stylesheet">
</head>
<body>
  <script src="common/js/site-config.js"></script>
  <script src="common/js/api.js?v=2.4"></script>
  <script src="common/js/auth.js?v=2.4"></script>
  <script src="common/js/components/header.js?v=2.4"></script>

  <main class="step-unified-shell">
    <section class="service-step-hero">
      <div class="service-step-label">STEP 03</div>
      <h1>가능서비스 확인</h1>
      <p>사전검토 결과와 사업지 유형을 기준으로 다음 단계에서 검토할 수 있는 서비스를 안내합니다.</p>
    </section>

    <div class="step-unified-content">
      <p id="service-message" class="service-system-message" role="status">사전검토 결과를 확인하고 있습니다.</p>

      <div id="service-content" hidden>
        <section class="summary">
          <div class="summary-card"><span>사전검토 결과</span><strong id="service-result">-</strong></div>
          <div class="summary-card"><span>사업지 유형</span><strong id="summaryType">-</strong></div>
          <div class="summary-card"><span>신청번호</span><strong id="service-request-no">-</strong></div>
        </section>

        <section class="section service-guide">
          <div class="section-head">
            <div>
              <h2>다음 단계 서비스 안내</h2>
              <p class="section-desc">아래 서비스는 사전검토 결과를 토대로 상담·신청을 검토할 수 있는 항목입니다. 실제 진행 여부와 범위는 개별 서비스 확인 과정에서 확정됩니다.</p>
            </div>
          </div>
          <div id="serviceList" class="service-list"></div>
        </section>

        <section class="section">
          <h2>검토결과 참고</h2>
          <div id="reviewReference" class="review-reference"></div>
        </section>

        <div class="service-bottom-actions">
          <button class="back-result-btn" id="back-result-button" type="button">검토결과 다시보기</button>
        </div>
      </div>
    </div>
  </main>

  <script src="common/js/components/footer.js"></script>
  <script src="precheck/service/js/script.js?v=2.4"></script>
</body>
</html>
