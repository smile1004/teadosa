<title>태양광도사 관리자페이지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">

/* Layout: 왼쪽 관리자 메뉴, 오른쪽 화면(카드 → 목록 → 상세) */
:root{
  --bg:#f3f4f1; --panel:#ffffff; --side:#1f2a33; --side-fg:#c9d1d6; --side-on:#f2b632;
  --fg:#1c2329; --muted:#5f6b73; --faint:#8b969d; --line:#dfe3e0; --soft:#eef1ee;
  --accent:#1f6f8b; --accent-bg:#e3f0f4; --on-accent:#ffffff;
  --ok:#2e7d4f; --ok-bg:#e4f2e8; --warn:#8a5a00; --warn-bg:#fbf0d6;
  --pkg:#0f6e63; --pkg-bg:#dff3ef; --trk:#9a4a1c; --trk-bg:#fbe8dc;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14191d; --panel:#1b2227; --side:#0f1417; --side-fg:#a9b4ba; --side-on:#f2b632;
  --fg:#e6eaec; --muted:#a3adb3; --faint:#78838a; --line:#2c353b; --soft:#232b31;
  --accent:#6fb8d2; --accent-bg:#1d3540; --on-accent:#0f1417;
  --ok:#7fcf9c; --ok-bg:#1c3326; --warn:#f0c46a; --warn-bg:#3a2f15;
  --pkg:#6fd3c3; --pkg-bg:#163631; --trk:#f2a578; --trk-bg:#3d2619; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14191d; --panel:#1b2227; --side:#0f1417; --side-fg:#a9b4ba; --side-on:#f2b632;
  --fg:#e6eaec; --muted:#a3adb3; --faint:#78838a; --line:#2c353b; --soft:#232b31;
  --accent:#6fb8d2; --accent-bg:#1d3540; --on-accent:#0f1417;
  --ok:#7fcf9c; --ok-bg:#1c3326; --warn:#f0c46a; --warn-bg:#3a2f15;
  --pkg:#6fd3c3; --pkg-bg:#163631; --trk:#f2a578; --trk-bg:#3d2619; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15.5px;line-height:1.55;padding-inline:16px;padding-block:16px 32px}
.wrap{max-width:1320px;margin:0 auto;display:grid;gap:12px}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 16px}
.top h1{font-size:21.5px;font-weight:600;margin:0;text-wrap:balance}
.top p{margin:0;color:var(--muted);font-size:14px}
.layout{display:grid;grid-template-columns:minmax(0,1fr)}
@media (max-width:1000px){.layout{grid-template-columns:minmax(0,1fr)}}
.app{display:grid;grid-template-columns:190px minmax(0,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel);min-width:0}
@media (max-width:640px){.app{grid-template-columns:minmax(0,1fr)}}
.side{background:#102b4c;padding:12px 8px;display:flex;flex-direction:column;gap:1px}
@media (max-width:640px){.side{flex-direction:row;flex-wrap:wrap;gap:4px}.side .grp,.side .logo{width:100%}}
.logo{color:#fff;font-weight:600;font-size:15.5px;padding:4px 8px 10px;letter-spacing:.02em}
.logo small{display:block;color:var(--side-fg);font-weight:400;font-size:13px;letter-spacing:.08em}
.grp{font-size:13px;color:#829ab4;padding:10px 8px 3px;letter-spacing:.06em}
.nv{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 8px;border-radius:6px;font:inherit;font-size:15.5px;color:#dce6f0;cursor:pointer}
@media (max-width:640px){.nv{width:auto;border:1px solid rgba(255,255,255,.2)}}
.nv:hover{background:rgba(255,255,255,.12);color:#fff}.nv.on{background:rgba(255,255,255,.12);color:#fff;font-weight:600;box-shadow:inset 3px 0 0 #f19135}
.nv.sub{padding-left:18px}
.nv:focus-visible,.btn:focus-visible,.chip:focus-visible,.card-b:focus-visible,.lk:focus-visible,tr.rw:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.main{padding:16px 18px;min-height:620px;min-width:0}
.h{font-size:18.5px;font-weight:600;margin:0 0 2px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.crumb{font-size:13px;color:var(--faint);margin-bottom:12px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.lk{font:inherit;font-size:13px;border:0;background:none;padding:0;color:var(--accent);cursor:pointer}
.lk:hover{text-decoration:underline}
.hint{font-size:13px;color:var(--faint);margin:-6px 0 12px}
.sec-h{font-size:13px;font-weight:600;margin:16px 0 8px;color:var(--muted);letter-spacing:.04em;display:flex;justify-content:space-between;align-items:center}
.sec-h:first-of-type{margin-top:4px}
.flt{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{font:inherit;font-size:13px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);cursor:pointer;background:none}
.chip.on{background:var(--fg);color:var(--panel);border-color:var(--fg)}
.chip em{font-style:normal;font-family:var(--mono);margin-left:4px;opacity:.75}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.card-b{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--panel);cursor:pointer;text-align:left;font:inherit;color:inherit;display:grid;gap:10px;align-content:start}
.card-b:hover{border-color:var(--accent)}
.card-b .nm{font-weight:600;font-size:15.5px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card-b .nm i{font-style:normal;color:var(--faint);font-weight:400}
.card-b .route{font-size:12.5px;color:var(--muted);line-height:1.5}
.cnt{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;text-align:center}
.cnt div{background:var(--soft);border-radius:6px;padding:5px 0 4px;font-size:11.5px;color:var(--muted)}
.cnt b{display:block;font-family:var(--mono);font-size:18.5px;font-weight:500;color:var(--fg);font-variant-numeric:tabular-nums}
.cnt .n b{color:var(--accent)}
.card-b .ft{font-size:12.5px;color:var(--faint)}
.cust{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center}
.av{width:36px;height:36px;border-radius:50%;background:var(--trk-bg);color:var(--trk);display:grid;place-items:center;font-weight:600;font-size:14px}
.cust .who b{display:block;font-size:15.5px;font-weight:600}
.cust .who span{font-size:13px;color:var(--muted)}
.mini{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3px}
.mini i{height:6px;border-radius:3px;background:var(--soft)}
.mini i.d{background:var(--ok)}.mini i.c{background:var(--accent)}
.meta{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:560px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:11.5px;color:var(--muted);font-weight:500;letter-spacing:.04em}
.no{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums}
tr.rw{cursor:pointer}tr.rw:hover td{background:var(--soft)}
.b{font-size:11.5px;padding:1px 7px;border-radius:4px;display:inline-block;font-weight:500}
.bi{background:var(--soft);color:var(--muted)}.bp{background:var(--pkg-bg);color:var(--pkg)}.bt{background:var(--trk-bg);color:var(--trk)}
.sb{font-size:11.5px;padding:1px 8px;border-radius:999px;display:inline-block;font-weight:500}
.s-n{background:var(--accent-bg);color:var(--accent)}.s-i{background:var(--warn-bg);color:var(--warn)}.s-d{background:var(--ok-bg);color:var(--ok)}
.st{font-size:13px;color:var(--muted)}.ok{color:var(--ok)}.wait{color:var(--faint)}
.bar{height:6px;border-radius:3px;background:var(--soft);overflow:hidden;width:64px;display:inline-block;vertical-align:middle;margin-right:6px}.bar i{display:block;height:100%;background:var(--accent)}
.card{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.ct{font-size:14px;font-weight:600;margin-bottom:8px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px 14px;font-size:14px}
.kv span{color:var(--faint);display:block;font-size:11.5px}
.btn{font:inherit;font-size:13px;padding:4px 10px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
.btn:hover{background:var(--soft)}
.btn.p{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:9px 12px;font-size:14px;margin-bottom:10px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px}
.stg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.stg div{text-align:center;font-size:12.5px;padding:6px 2px;border-radius:6px;border:1px solid var(--line);color:var(--muted)}
.stg .d{background:var(--ok-bg);color:var(--ok);border-color:transparent}.stg .c{background:var(--accent-bg);color:var(--accent);border-color:var(--accent);font-weight:500}
.log{font-size:14px;display:grid;gap:4px}.log span{color:var(--faint);margin-right:8px;font-family:var(--mono);font-size:13px}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:6px}
.mt{background:var(--soft);border-radius:8px;padding:10px 12px}.mt span{font-size:13px;color:var(--muted)}.mt b{display:block;font-size:24px;font-weight:500;font-family:var(--mono)}
.empty{padding:24px;text-align:center;color:var(--faint);font-size:14px}
.notes{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
@media (max-width:1000px){.notes{position:static}}
.notes h2{font-size:15.5px;font-weight:600;margin:0 0 2px}
.notes .sub{font-size:13px;color:var(--faint);margin:0 0 10px}
.notes ol{margin:0;padding-left:18px;display:grid;gap:8px;font-size:14px}
.notes .tip{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.main>*{animation:in .18s ease-out}@keyframes in{from{opacity:.4}to{opacity:1}}}
.flow{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(84px,1fr);gap:0;min-width:520px;padding:4px 0}
.fs{position:relative;text-align:center;display:grid;gap:3px;justify-items:center;font-size:12px;color:var(--faint)}
.fs::before{content:"";position:absolute;top:8px;left:-50%;width:100%;height:2px;background:var(--line);z-index:0}
.fs:first-child::before{display:none}
.fs i{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);background:var(--panel);position:relative;z-index:1}
.fs b{font-weight:500;color:var(--muted);font-size:12.5px}
.fs.d::before,.fs.c::before{background:var(--ok)}
.fs.d i{background:var(--ok);border-color:var(--ok)}.fs.d b{color:var(--fg)}
.fs.c i{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}.fs.c b{color:var(--accent);font-weight:600}
.clg{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px 20px}
.clt{margin:0 0 6px;font-size:11.5px;color:var(--faint);letter-spacing:.04em}
.cl{display:flex;gap:8px;align-items:center;padding:5px 0;font-size:13px;cursor:pointer}
.cl input{width:16px;height:16px;accent-color:var(--ok);margin:0}
.cl input:checked+span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.sel,.ta{width:100%;font:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--fg)}
a.btn{text-decoration:none;display:inline-block}
</style>

    </div>
  </div>
</div>

function findIt(arg){const [k,no]=arg.split('|');const o=O.find(x=>x.items.some(i=>i[1]===no));return{k,no,o,it:o.items.find(i=>i[1]===no)};}
function belong(o,k,no){const back=o.t==='턴키'?'trk':o.t==='패키지'?'pkg':null;

function sp(arg){const {k,no,o,it}=findIt(arg);nav('svc',k);const st=STEPS[k],ci=stepIdx(k,it[2]),done=it[2]==='완료';

 <div class="card"><div class="ct">진행 단계 <span class="st">${ci+1}/${st.length} 단계${it[2]==='보완요청'?' · 보완요청 중':''}</span></div><div class="tw"><div class="flow">${st.map((s2,j)=>`<div class="fs ${j<ci||done?'d':j===ci?'c':''}"><i></i><b>${s2}</b><span>${dates[j]||'예정'}</span></div>`).join('')}</div></div></div>

 const all=c.g.flatMap(x=>x[1]);let n=0;const on=done?all.length:Math.round(all.length*ci/(st.length-1));

`<div class="metrics"><div class="mt"><span>패키지 전체</span><b>${all.length}</b></div><div class="mt"><span>견적 확인 대기</span><b>${q}</b></div><div class="mt"><span>미배정</span><b>${ua}</b></div><div class="mt"><span>완료</span><b>${all.filter(o=>o.st==='완료').length}</b></div></div>

<div class="sec-h">패키지 신청 통합 목록</div>`+
chips('pkgh','',['전체',...Object.keys(PK).map(k=>PK[k][0])].map(k=>[k,cp(k)]),F.pkgh,'전체 패키지')+
chips('pkgh','',['전체','신규','진행중','완료'].map(k=>[k,cs(k)]),F.pkghS,'전체 상태').replace(/data-f=/g,'data-fk="pkghS" data-f=')+
(vis.length?`<div class="tw"><table><tr><th>신청번호</th><th>패키지</th><th>고객</th><th>용량</th><th>진행률</th><th>상태</th><th>견적·계약</th><th>담당</th></tr>`+
vis.map(o=>`<tr class="rw" tabindex="0" data-act="pkg" data-arg="${o.no}"><td class="no">${o.no}</td><td><span class="b bp">${PK[o.pk][0].replace(' 패키지','')}</span></td><td>${o.cust}</td><td>${o.kw}</td><td>${prog(o)}</td><td>${sb(cat(o.st))}</td><td class="st">${o.qs}</td><td class="${o.own==='미배정'?'wait':''}">${o.own}</td></tr>`).join('')+'</table></div>':'<div class="empty">조건에 맞는 패키지 신청이 없습니다</div>');}
