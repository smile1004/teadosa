<!DOCTYPE html>
<html lang="ko">
<head>
  <base href="../../">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>회원관리 | 태양광도사 관리자</title>
  <link href="admin/css/style.css?v=3.4" rel="stylesheet">
</head>
<body class="admin-body">
  <div class="admin-app">
    <aside class="admin-sidebar">
      <a class="admin-brand" href="/admin/" aria-label="태도 관리자 홈"><img class="admin-brand-logo" src="admin/images/taedo-logo-vertical.png" alt="태도(주) TAEDO"><span class="admin-brand-admin">ADMIN SYSTEM</span></a>
      <nav class="admin-nav" aria-label="관리자 메뉴">
        <p>운영 관리</p>
        <a data-admin-path="/admin/" href="/admin/"><span>⌂</span>대시보드</a>
        <a data-admin-path="/admin/members/" href="/admin/members/"><span>♙</span>회원관리</a>
        <p>서비스 관리</p>
        <a data-admin-path="/admin/precheck/" href="/admin/precheck/"><span>□</span>사전검토 관리</a>
        <a data-admin-path="/admin/license/" href="/admin/license/"><span>□</span>발전사업허가 관리</a><a data-admin-path="/admin/development/" href="/admin/development/"><span>□</span>개발행위허가 관리</a><a data-admin-path="/admin/ppa/" href="/admin/ppa/"><span>□</span>한전PPA 관리</a><a data-admin-path="/admin/construction-plan/" href="/admin/construction-plan/"><span>□</span>공사계획신고 관리</a>
        <p>시스템</p>
        <span class="admin-nav-disabled"><span>⚙</span>환경설정<em>준비중</em></span>
      </nav>
      <a class="admin-site-link" href="/">사이트로 돌아가기</a>
    </aside>
    <div class="admin-workspace">
      <header class="admin-topbar"><div><button class="admin-menu-button" type="button">☰</button><span class="admin-breadcrumb">관리자 / 회원관리</span></div><div class="admin-account"><span id="admin-user-name">관리자님</span><button id="admin-logout" type="button">로그아웃</button></div></header>
      <main class="admin-main">
        <p id="admin-access-message" class="admin-message" role="status">관리자 권한을 확인하고 있습니다.</p>
        <div id="admin-protected-content" hidden>
          <section class="admin-page-head"><div><p class="admin-eyebrow">MEMBERS</p><h1>회원관리</h1><p>회원 검색과 기업회원 승인 상태를 관리합니다.</p></div><a class="admin-button secondary" href="/admin/">대시보드</a></section>
          <div id="admin-content">
            <section class="admin-summary" aria-label="회원 현황"><article><span>전체 회원</span><strong id="total-count">0</strong></article><article><span>현재 검색 결과</span><strong id="result-count">0</strong></article><article><span>승인 대기</span><strong id="pending-count">0</strong></article></section>
            <section class="admin-panel"><form id="member-search-form" class="admin-filter" role="search"><label class="search-field"><span>회원 검색</span><input id="member-search" type="search" maxlength="100" placeholder="아이디, 이름, 이메일, 기업명, 사업자번호"></label><label><span>회원 유형</span><select id="member-type-filter"><option value="">전체</option><option value="personal">개인회원</option><option value="business">기업회원</option></select></label><label><span>승인 상태</span><select id="approval-filter"><option value="">전체</option><option value="pending">승인 대기</option><option value="approved">승인 완료</option></select></label><button class="admin-button primary" type="submit">검색</button><button id="reset-filter" class="admin-button secondary" type="button">초기화</button></form></section>
            <section class="admin-panel member-panel" aria-labelledby="member-list-title"><div class="panel-head"><div><p class="panel-kicker">MEMBERS</p><h2 id="member-list-title">회원목록</h2></div><button id="refresh-members" class="admin-button secondary" type="button">새로고침</button></div><p id="member-list-message" class="admin-inline-message" role="status"></p><div class="table-wrap"><table class="member-table"><thead><tr><th>회원</th><th>구분</th><th>기업정보</th><th>연락처</th><th>상태</th><th>가입일</th><th>관리</th></tr></thead><tbody id="member-table-body"></tbody></table></div><div class="admin-pagination"><button id="previous-page" class="admin-button secondary" type="button">이전</button><span id="page-status">1 / 1</span><button id="next-page" class="admin-button secondary" type="button">다음</button></div></section>
          </div>
        </div>
      </main>
    </div>
  </div>
  <script src="common/js/api.js?v=2.2"></script>
  <script src="common/js/auth.js?v=2.2"></script>
  <script src="common/js/admin-layout.js?v=2.7"></script>
  <script src="common/js/admin-members.js?v=2.2"></script>
</body>
</html>
