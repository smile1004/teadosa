<!DOCTYPE html>
<html lang="ko">
<head>
  <base href="../../">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>사전검토 관리 | 태양광도사 관리자</title>
  <link href="admin/css/style.css?v=3.4" rel="stylesheet">
</head>
<body class="admin-body">
  <div class="admin-app">
    <aside class="admin-sidebar">
      <a class="admin-brand" href="/admin/" aria-label="태도 관리자 홈"><img class="admin-brand-logo" src="admin/images/taedo-logo-vertical.png" alt="태도(주) TAEDO"><span class="admin-brand-admin">ADMIN SYSTEM</span></a>
      <nav class="admin-nav" aria-label="관리자 메뉴">
        <p>운영 관리</p>
        <a data-admin-path="/admin/" href="/admin/"><span>⌂</span>대시보드</a>
        <a data-admin-path="/admin/members/" href="/admin/members/"><span>♙</span>회원관리</a>
        <p>서비스 관리</p>
        <a data-admin-path="/admin/precheck/" href="/admin/precheck/"><span>□</span>사전검토 관리</a>
        <a data-admin-path="/admin/license/" href="/admin/license/"><span>□</span>발전사업허가 관리</a><a data-admin-path="/admin/development/" href="/admin/development/"><span>□</span>개발행위허가 관리</a><a data-admin-path="/admin/ppa/" href="/admin/ppa/"><span>□</span>한전PPA 관리</a><a data-admin-path="/admin/construction-plan/" href="/admin/construction-plan/"><span>□</span>공사계획신고 관리</a>
        <p>시스템</p>
        <span class="admin-nav-disabled"><span>⚙</span>환경설정<em>준비중</em></span>
      </nav>
      <a class="admin-site-link" href="/">사이트로 돌아가기</a>
    </aside>

    <div class="admin-workspace">
      <header class="admin-topbar"><div><button class="admin-menu-button" type="button" aria-label="메뉴 열기">☰</button><span class="admin-breadcrumb">관리자 / 사전검토 관리</span></div><div class="admin-account"><span id="admin-user-name">관리자님</span><button id="admin-logout" type="button">로그아웃</button></div></header>
      <main class="admin-main">
        <p id="admin-access-message" class="admin-message" role="status">관리자 권한을 확인하고 있습니다.</p>
        <div id="admin-protected-content" hidden>
          <section class="admin-page-head">
            <div><p class="admin-eyebrow">PRECHECK</p><h1>사전검토 관리</h1><p>접수된 사전검토 신청을 검색하고 처리상태를 관리합니다.</p></div>
            <a class="admin-button secondary" href="/admin/">대시보드</a>
          </section>

          <section class="admin-summary precheck-summary" aria-label="사전검토 현황">
            <article><span>전체 신청</span><strong id="precheck-total-count">0</strong></article>
            <article><span>접수</span><strong id="precheck-received-count">0</strong></article>
            <article><span>검토중</span><strong id="precheck-reviewing-count">0</strong></article>
            <article><span>보완요청</span><strong id="precheck-supplement-count">0</strong></article>
            <article><span>검토완료</span><strong id="precheck-completed-count">0</strong></article>
          </section>

          <section class="admin-panel">
            <form id="precheck-search-form" class="admin-filter precheck-filter" role="search">
              <label class="search-field"><span>신청 검색</span><input id="precheck-search" type="search" maxlength="100" placeholder="신청번호, 신청자, 연락처, 회사명, 설치주소"></label>
              <label><span>처리 상태</span><select id="precheck-status-filter"><option value="">전체</option><option value="received">접수</option><option value="reviewing">검토중</option><option value="supplement_required">보완요청</option><option value="completed">검토완료</option></select></label>
              <button class="admin-button primary" type="submit">검색</button>
              <button id="precheck-reset-filter" class="admin-button secondary" type="button">초기화</button>
            </form>
          </section>

          <section class="admin-panel precheck-panel" aria-labelledby="precheck-list-title">
            <div class="panel-head"><div><p class="panel-kicker">REQUESTS</p><h2 id="precheck-list-title">사전검토 신청목록</h2></div><button id="refresh-precheck" class="admin-button secondary" type="button">새로고침</button></div>
            <p id="precheck-list-message" class="admin-inline-message" role="status"></p>
            <div class="table-wrap">
              <table class="member-table precheck-table">
                <thead><tr><th>신청번호</th><th>신청자</th><th>연락처</th><th>회사명</th><th>설치주소</th><th>신청일</th><th>처리상태</th><th>관리</th></tr></thead>
                <tbody id="precheck-table-body"></tbody>
              </table>
            </div>
            <div class="admin-pagination"><button id="precheck-previous-page" class="admin-button secondary" type="button">이전</button><span id="precheck-page-status">1 / 1</span><button id="precheck-next-page" class="admin-button secondary" type="button">다음</button></div>
          </section>
        </div>
      </main>
    </div>
  </div>
  <script src="common/js/api.js?v=2.3"></script>
  <script src="common/js/auth.js?v=2.5"></script>
  <script src="common/js/admin-layout.js?v=2.7"></script>
  <script src="common/js/admin-precheck.js?v=2.5"></script>
</body>
</html>
