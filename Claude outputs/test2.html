<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>지자체 조례 조회 테스트</title><link rel="stylesheet" href="/admin/kepco-test/style.css"><link rel="stylesheet" href="/admin/ordin-test/style.css"></head>
<body><main><header style="display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;"><div><h1>지자체 조례 조회</h1><p>지역명을 입력하면 해당 지자체의 도시계획(군계획) 조례에서 키워드가 포함된 조항을 찾아 보여줍니다.</p></div><nav style="display:flex;gap:8px;flex-shrink:0;"><a href="/" style="padding:10px 16px;border-radius:8px;background:#4f7f34;color:#fff;text-decoration:none;font-size:14px;font-weight:bold;white-space:nowrap;">🏠 홈</a><a href="/test1" style="padding:10px 16px;border-radius:8px;background:#edf2ee;color:#38543e;border:1px solid #cddbcf;text-decoration:none;font-size:14px;font-weight:bold;white-space:nowrap;">계통연계조회</a></nav></header>
<section><h2>검색 조건</h2><form id="ordin-form"><div class="fields"><label>지역명<input name="region" required maxlength="150" value="완주군" placeholder="예: 완주군, 파주시"></label><label>키워드<input name="keyword" required maxlength="100" value="개발행위허가" placeholder="예: 개발행위허가"></label></div><details><summary>기관코드로 검색 범위 제한 (선택)</summary><div class="fields"><label>시도 기관코드<input name="org" pattern="[0-9]{7}" placeholder="7자리 기관코드"></label><label>시군구 기관코드<input name="sborg" pattern="[0-9]{7}" placeholder="7자리 기관코드"></label></div></details><button id="search-button">조례 검색</button></form></section>
<section><h2>검색 결과</h2><p id="list-status" role="status">지역명을 입력하고 조례 검색을 눌러 주세요.</p><div id="ordin-rows"></div></section>
<section><details><summary>원본 응답 확인</summary><pre id="ordin-raw">아직 조회하지 않았습니다.</pre></details></section></main><script src="/admin/ordin-test/script.js"></script></body></html>
