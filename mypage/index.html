<!DOCTYPE html>
<html lang="ko"><head><base href="../"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>마이페이지 | 태양광도사</title><link href="common/css/shared-layout.css" rel="stylesheet"><link href="common/css/shared-menu.css" rel="stylesheet"><link href="common/css/common.css" rel="stylesheet"><style>.mypage-main{min-height:70vh;padding:150px 20px 80px;background:#f7f9fb}.mypage-card{width:min(720px,100%);margin:auto;padding:36px;border:1px solid #dfe5eb;border-radius:20px;background:#fff;box-shadow:0 14px 40px rgba(19,39,62,.065)}.mypage-card h1{margin:0 0 14px;color:#0b2748}.mypage-info{display:grid;gap:12px;margin-top:26px}.mypage-row{display:grid;grid-template-columns:130px 1fr;gap:18px;padding:14px 0;border-bottom:1px solid #edf1f4}.mypage-row span:first-child{font-weight:700;color:#647385}</style></head><body class="taedo-has-fixed-header"><script src="common/js/site-config.js"></script><script src="common/js/components/header.js"></script><main class="mypage-main"><section class="mypage-card"><h1>마이페이지</h1><p>현재 로그인한 회원의 기본 정보입니다.</p><div id="mypage-info" class="mypage-info" hidden></div><p id="mypage-message">회원 정보를 확인하고 있습니다.</p></section></main><script src="common/js/components/footer.js"></script><script>(async function(){const info=document.getElementById('mypage-info'),message=document.getElementById('mypage-message');try{const r=await fetch('/api/auth/me',{credentials:'same-origin'});if(!r.ok){location.href='/login/?next=/mypage/';return;}const data=await r.json(),m=data.member||{};info.innerHTML='<div class="mypage-row"><span>회원 유형</span><span>'+(m.memberType==='business'?'기업 전문 회원':'개인 회원')+'</span></div><div class="mypage-row"><span>아이디</span><span>'+escapeHtml(m.username||'')+'</span></div><div class="mypage-row"><span>이름</span><span>'+escapeHtml(m.name||'')+'</span></div><div class="mypage-row"><span>이메일</span><span>'+escapeHtml(m.email||'')+'</span></div><div class="mypage-row"><span>승인 상태</span><span>'+escapeHtml(m.approvalStatus||'')+'</span></div>';info.hidden=false;message.hidden=true;}catch(e){message.textContent='회원 정보를 불러오지 못했습니다.';}function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}})();</script></body></html>
