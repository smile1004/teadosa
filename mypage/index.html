<!DOCTYPE html>
<html lang="ko">
<head>
  <base href="../">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>마이페이지 | 태양광도사</title>
  <link href="common/css/shared-layout.css?v=1.3" rel="stylesheet">
  <link href="common/css/shared-menu.css?v=1.3" rel="stylesheet">
  <link href="common/css/common.css?v=1.3" rel="stylesheet">
  <link href="mypage/css/style.css?v=1.3" rel="stylesheet">
</head>
<body class="taedo-has-fixed-header">
  <script src="common/js/site-config.js?v=1.3"></script>
  <script src="common/js/components/header.js?v=1.3"></script>

  <main class="mypage-main">
    <section class="mypage-card">
      <h1>마이페이지</h1>
      <p>현재 로그인한 회원의 기본 정보입니다.</p>
      <div id="mypage-info" class="mypage-info" hidden></div>
      <p id="mypage-message">회원 정보를 확인하고 있습니다.</p>
    </section>
  </main>

  <script src="common/js/components/footer.js?v=1.3"></script>
  <script>
    (async function () {
      const info = document.getElementById('mypage-info');
      const message = document.getElementById('mypage-message');

      try {
        const response = await fetch('/api/auth/me', {
          credentials: 'same-origin'
        });

        if (!response.ok) {
          location.href = '/login/?next=/mypage/';
          return;
        }

        const data = await response.json();
        const member = data.member || {};

        info.innerHTML = [
          createRow('회원 유형', member.memberType === 'business' ? '기업 전문 회원' : '개인 회원'),
          createRow('아이디', member.username || ''),
          createRow('이름', member.name || ''),
          createRow('이메일', member.email || ''),
          createRow('승인 상태', member.approvalStatus || '')
        ].join('');

        info.hidden = false;
        message.hidden = true;
      } catch (error) {
        message.textContent = '회원 정보를 불러오지 못했습니다.';
      }

      function createRow(label, value) {
        return '<div class="mypage-row"><span>' + escapeHtml(label) + '</span><span>' + escapeHtml(value) + '</span></div>';
      }

      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, function (character) {
          return {
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#039;'
          }[character];
        });
      }
    }());
  </script>
</body>
</html>
